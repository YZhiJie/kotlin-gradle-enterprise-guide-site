<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.01</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">空安全与数据建模</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Kotlin &amp; Gradle 漫画剧场 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：又一个 NPE</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-44,306 L-36,254 L-22,290 L-8,246 L6,290 L20,254 L32,290 L44,306 Q0,268 -44,306 Z" fill="#f97316" transform="translate(0,-306)"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="320" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Java 里 user 可能为 null，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">user.getName() 直接炸！</text>
    <rect x="24" y="152" width="524" height="92" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.45"/>
    <text x="38" y="174" font-size="12.5" fill="#f97316" font-family="'SF Mono',Consolas,monospace">// Java：编译器不拦你</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">User user = findUser(id);</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">String name = user.getName();</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// NullPointerException!</text>
    <rect x="24" y="258" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="258" width="4" height="72" rx="2" fill="#22d3ee"/>
    <text x="40" y="280" font-size="13.5" fill="#e2e8f0">Kotlin 把可空性写进类型系统：</text>
    <text x="40" y="300" font-size="13.5" fill="#94a3b8">类型为 `String?` 才允许 null，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">`String` 则编译器保证非空。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：空安全四件套</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="352" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">四把钥匙，把 NPE 挡在</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">编译期，而不是运行时。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">val email: String? = user?.email</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">val len  = user?.email?.length ?: 0</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">val safe = any as? Int</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">val bad  = user!!.name  // 慎用！</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// ?. 安全调用  ?: Elvis  as? 转换</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">核心：把"可能为 null"编码进类型，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">编译器替你做 null 检查。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：建模三件套</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="300" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">data class 存数据，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">sealed 管状态穷尽。</text>
    <rect x="24" y="152" width="524" height="128" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">data class User(val name: String,</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  val email: String?)</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">sealed class Result {</text>
    <text x="38" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  data class Success(val data: T) : Result()</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  data class Failure(val msg: String) : Result()</text>
    <text x="38" y="264" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <rect x="24" y="296" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="46" rx="2" fill="#f472b6"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">when 不写 else 也能穷尽，</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">新增子类 → 所有 when 编译报错。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：val 优先 拒绝 !!</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="300" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">把"不确定"变成"确定"：</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">编译期就把空指针掐死。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">!! 是在告诉编译器"别管我"，NPE 照炸</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">Java 互操作的平台类型要加注解</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">data class 别放可变集合进 equals</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">空安全是思维方式：让类型替你守第一道关。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · kotlin-gradle-enterprise-guide · EP.01</text>
</svg>
